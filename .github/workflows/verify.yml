name: Verify
on: [push, pull_request]
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/build.mjs preview && node scripts/verify-site.mjs preview
      - run: node scripts/build.mjs production && node scripts/verify-site.mjs production
